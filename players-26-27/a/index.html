const SEC_JA = {GK:"ゴールキーパー", DF:"ディフェンダー", MF:"ミッドフィールダー", FW:"フォワード", STAFF:"スタッフ"};
const app=document.getElementById("app");
for(const [sec,players] of Object.entries(DATA)){
  const s=document.createElement("section");
  s.id="sec-"+sec;
  s.innerHTML=`<div class="sec-head"><span class="en">${sec}</span><span class="ja">${SEC_JA[sec]}</span></div>`;
  const g=document.createElement("div"); g.className="grid";
  for(const p of players){
    if(sec==="STAFF"){
      // スタッフ: 白ミニマルカード(写真＋役職＋氏名)
      g.insertAdjacentHTML("beforeend",`
      <div class="card staff sv-white">
        <div class="shot"><img src="${IMG}${p.img}" alt="${p.ja}" loading="lazy" width="800" height="800"></div>
        <div class="band${p.en.length>=18?' len-l':p.en.length>=14?' len-m':''}">${p.en}</div>
        <div class="info">
          <div class="role-jp">${p.role||""}</div>
          <div class="name-ja"><span class="kanji">${p.ja}</span></div>
          <dl class="prof">
            ${p.dob?`<dt>生年月日</dt><dd>${p.dob}</dd>`:""}
            ${p.from?`<dt>出身</dt><dd>${p.from}</dd>`:""}
          </dl>
        </div>
      </div>`);
      continue;
    }
    // 選手: 背番号は写真にCSSで重ねる。名前は日本語氏名。カード全体が個人ページへのリンク
    g.insertAdjacentHTML("beforeend",`
      <a class="card card-link" href="players/${p.num}.html">
        <div class="shot">
          <img src="${IMG}${p.img}" alt="${p.ja}" loading="lazy" width="800" height="800">
          ${p.num!==null?`<span class="shirt-no">${p.num}</span>`:""}
        </div>
        <div class="band">${p.en}</div>
        <div class="info">
          <div class="pos-line">${sec}</div>
          <div class="name-ja"><span class="kanji">${p.ja}</span></div>
          <dl class="prof">
            ${p.from?`<dt>出身</dt><dd>${p.from}</dd>`:""}
          </dl>
        </div>
      </a>`);
  }
  s.appendChild(g); app.appendChild(s);
}
// ===== 位置ナビ: 追従top調整・スクロールスパイ(B案pnavと同じ挙動) =====
function go(id){var el=document.getElementById(id);if(!el)return;
  var ab=document.querySelector('.ad-bar'),pn=document.getElementById('pnav');
  var off=(ab?ab.offsetHeight:0)+pn.offsetHeight+16;
  window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-off,behavior:'smooth'});}
function toTop(){window.scrollTo({top:0,behavior:'smooth'});}
(function(){
  var ab=document.querySelector('.ad-bar'),pn=document.getElementById('pnav');
  function setTop(){pn.style.top=(ab?ab.offsetHeight:0)+'px';}
  window.addEventListener('resize',setTop);setTop();
  var ids=['sec-GK','sec-DF','sec-MF','sec-FW','sec-STAFF'];
  function spy(){var off=(ab?ab.offsetHeight:0)+pn.offsetHeight+40,cur=null;
    for(var i=0;i<ids.length;i++){var el=document.getElementById(ids[i]);if(el&&el.getBoundingClientRect().top<=off)cur=ids[i];}
    document.querySelectorAll('.pn-tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.sec===cur);});}
  var t=false;window.addEventListener('scroll',function(){if(!t){t=true;requestAnimationFrame(function(){spy();t=false;});}},{passive:true});
  spy();
})();
