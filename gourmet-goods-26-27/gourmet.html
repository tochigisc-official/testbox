<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スタジアムグルメ｜栃木SC ホームゲーム 9/5 vs 高知</title>
<!-- タブのアイコン。栃木SCエンブレムから生成 -->
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ホームゲームLP本体と同じ3書体。和文を端末まかせにすると、Windowsで
     游ゴシックに落ちてLPと別書体のページに見えるため、必ず読み込む。 -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   共通トンマナ層 ─ ホームゲームLP本体から抜き出した「見た目の土台」
   -----------------------------------------------------------
   【役割】
   グルメ／グッズ詳細ページは、ホームゲームLPの1つの節を展開した
   派生ページである。別サイトに見えてはいけない。
   そのため、色・書体・見出しの組み方・カードの体裁といった
   「同じサイトだと分かる部分」は、ここ1か所だけで定義する。

   【出どころ】
   すべて homegame_lp/20260809/index.html の実装値をそのまま写している。
   数値を勝手に変えないこと。変えるならLP本体と同時に変える。

   【使い方】
   build_gourmet.mjs がテンプレートの __TONE__ 目印にこの中身を差し込む。
   ページは1枚のHTMLとして完結する（CSSファイルの読み込み事故が起きない）。
   ※この目印をコメント内に「スラッシュ＋アスタリスク」の形で書かないこと。
     CSSのコメントは入れ子にできず、そこでコメントが終わってしまう。

   【Webフォント】
   Anton / Poppins / Noto Sans JP の読み込みは各テンプレートの <head> に置く。
   ここはCSSなので <link> を書けない。3書体そろって初めてLPと同じ見た目になる。
   =========================================================== */

:root{
  /* --- ブランド色（LP本体と同一）。ここに無い色を足さない --- */
  --yellow:#FFEA00; --blue:#004D9F; --navy:#042242; --white:#FFFFFF;
  --ink:#042242; --paper:#FFFCE8;
  --line:#E4E8EE;
  --muted:#6a7482;

  /* --- 書体（LP本体と同一）--- */
  --disp:'Anton',sans-serif;          /* 英字見出し。ページの顔 */
  --latin:'Poppins',sans-serif;       /* 英字の小さい文字・価格 */
  --jp:'Noto Sans JP',sans-serif;     /* 和文。端末依存にしない */

  /* --- 器 --- */
  --page:#EDEFF2; --maxw:680px;

  /* --- カード（LP本体 .rail .card と同一）--- */
  --card-r:16px; --card-bd:#E7EAF0; --card-sh:0 4px 16px rgba(4,34,66,.12);
  --r-btn:6px;

  /* --- 番号バッジ：場外／場内の区別 -------------------------
     LP本体に赤は1色も使われていないため、赤（#DB0025）は廃止した。
     ネイビー塗り＝場外、黄色塗り＝場内。スタジアムの中に入ると
     チームカラーになる、という対応で覚えられる。
     どちらもLP本体にある配色（.hero .op-jp / .sp-body .tag）。 */
  --pin-out-bg:var(--navy);   --pin-out-fg:#fff;     --pin-out-bd:#fff;
  --pin-in-bg:var(--yellow);  --pin-in-fg:var(--navy); --pin-in-bd:var(--navy);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;}
body{
  font-family:var(--jp); color:var(--ink); background:#fff;
  -webkit-font-smoothing:antialiased;
  font-size:16px; line-height:1.8;   /* LP本体と同じ行間。詰めない */
  overflow-x:hidden;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}

/* --- 器：LP本体の .device と同じ挙動 ---------------------------
   スマホ＝白の全幅。PC＝グレー地に680pxの紙が浮く。
   LPから来たときに幅と佇まいが変わらないようにするため。 */
.wrap{max-width:var(--maxw); margin:0 auto; background:#fff; position:relative;}
@media(min-width:601px){
  /* LP本体の body は余白ゼロ（padding:0）。こちらだけ上下左右に余白を持たせると、
     紙の左右が細くなり、フッターの下にグレーの帯が残って別物に見える。 */
  body{background:var(--page); padding:0;}
  .wrap{box-shadow:0 2px 20px rgba(4,34,66,.08);}
}

/* --- 見出し：LP本体の .head と同じ組み方 -----------------------
   英字（Anton・31px・ネイビー）が主役で1行目に立ち、
   その下にアイコン＋和文＋黄色マーカー。この順序がLPの顔。
   英字を小さな飾りに落とすと、途端に別サイトに見える。 */
.head{padding:15px 20px 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.head .disp{
  width:100%; order:-1;
  font-family:var(--disp); font-weight:400; font-size:31px; line-height:1;
  letter-spacing:.03em; color:var(--navy); margin-bottom:7px; text-transform:uppercase;
}
.head .hicon{flex:none; width:30px; height:30px; color:var(--navy);}
.head .hicon svg{width:30px; height:30px; stroke:currentColor; stroke-width:1.7; fill:none;
                 stroke-linecap:round; stroke-linejoin:round;}
.head h2{font-size:22px; font-weight:900; line-height:1.3; color:var(--navy);
         display:inline-block; position:relative;}
/* 黄色マーカーは文字を包んで引く（下線ではなく蛍光ペン）。文字数に追従する */
.head h2 .mk{background:linear-gradient(transparent 60%, var(--yellow) 60% 92%, transparent 92%);
             padding:0 2px;}
.head .cnt{font-size:13px; color:var(--muted); font-weight:700;}
.subbrand{font-family:var(--latin); color:var(--navy); font-size:12px; font-weight:700;
          letter-spacing:.1em; margin-left:10px; align-self:baseline; padding-top:8px; white-space:nowrap;}
.slead{color:#333; font-size:14px; padding:6px 20px 0;}

/* --- 節の区切り：中央に黄色の短い棒（LP本体 .sec-div）--- */
.sec-div{position:relative; height:1px; background:var(--line); margin:26px 20px 8px;}
.sec-div::before{content:""; position:absolute; left:50%; top:-1.5px; transform:translateX(-50%);
                 width:40px; height:4px; border-radius:2px; background:var(--yellow);}

/* --- 帯（LP本体と同じ4種）--- */
.band-white{background:#fff;}
.band-soft{background:#F7F9FC;}
.band-paper{background:var(--paper);}
.band-yellow{background:var(--yellow);}

/* --- カード：LP本体 .rail .card と同一の体裁 --- */
.card{background:#fff; border:1px solid var(--card-bd); border-radius:var(--card-r);
      overflow:hidden; box-shadow:var(--card-sh); display:flex; flex-direction:column;}

/* --- 番号バッジ（会場図のピン・店リストの番号で共用）-----------
   丸数字（①）は環境によって二重丸や斜体で描画されるため使わない。
   円＋算用数字で描く。数字の幅を揃えるため tabular-nums を指定。 */
.no{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; background:var(--pin-out-bg); color:var(--pin-out-fg);
    font-family:'Helvetica Neue',Arial,sans-serif; font-weight:900; font-style:normal;
    font-variant-numeric:tabular-nums; line-height:1;}
.no.in{background:var(--pin-in-bg); color:var(--pin-in-fg);}

/* --- 追従ヘッダー -----------------------------------------------
   LP本体の .qnav と同じネイビー地。下の黄色線は、すぐ下にくる
   ブランド帯（黄色）と二重の帯に見えるため引かない。 */
header.hd{position:sticky; top:0; z-index:40; background:var(--navy);}
.hd-in{display:flex; align-items:center; justify-content:space-between;
       gap:10px; padding:9px 14px;}
/* 戻る。「◀」の塗り三角は他のアイコン（線画）と質感が合わないため、
   丸い枠に線の矢印を入れた形にする。ページ内の他のアイコンと揃う。 */
.back{display:inline-flex; align-items:center; gap:8px;
      font-size:14.5px; color:#fff; font-weight:600; white-space:nowrap;}
.back .ic{flex:none; width:26px; height:26px; border-radius:50%;
          border:1.5px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center;}
.back .ic svg{width:14px; height:14px; stroke:#fff; stroke-width:2; fill:none;
              stroke-linecap:round; stroke-linejoin:round;}

/* グルメ⇄グッズの切り替え。枠線を引かず、薄い地の上に「つまみ」を置く形。
   選択中がどちらかを、線ではなく面で示す。 */
.seg{display:flex; align-items:center; gap:2px; padding:3px;
     background:rgba(255,255,255,.15); border-radius:999px;
     font-size:13.5px; font-weight:800; white-space:nowrap;}
.seg a{padding:5px 14px; border-radius:999px; color:rgba(255,255,255,.72); background:transparent;
       white-space:nowrap; transition:background .15s, color .15s;}
.seg a.on{background:var(--yellow); color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.18);}
/* グッズページがまだできていない試合。リンクにせず、押せないことが分かる見た目にする。 */
.seg .soon{padding:5px 10px 5px 14px; border-radius:999px; display:inline-flex; align-items:center; gap:6px;
           color:rgba(255,255,255,.45); cursor:default;}
.seg .soon small{font-size:9.5px; font-weight:800; letter-spacing:.02em; line-height:1;
                 color:rgba(255,255,255,.6); background:rgba(255,255,255,.16);
                 padding:2px 6px; border-radius:999px;}

/* ページ内移動。ネイビー地の上では黄色マーカーが読めないので、
   現在地は黄色の文字＋下線で示す。LPの .qnav a:hover と同じ考え方。 */
/* 左寄せだと右側だけ余白が残り、上段（中央のグルメ⇄グッズ）と軸がずれて見える。
   space-evenly で左右対称に散らす。gap は「最低これだけは空ける」下限として効くので、
   幅の狭い端末では 10px まで詰まり、項目が4つでも折り返さない。 */
.jump{display:flex; align-items:center; justify-content:space-evenly; gap:10px; padding:0 16px 9px;
      overflow:hidden; transition:max-height .22s ease, opacity .18s ease; max-height:44px;}
/* 上段（戻る・グルメ⇄グッズ）は常に出したまま、ページ内ナビの帯だけ畳んで
   本文の見える面積を増やす。畳むと高さが変わり、その分だけ本文が動くが、
   その動きを「上へのスクロール」と誤って読まないよう、切り替え直後の
   短いあいだは判定を止めている（nav.js）。 */
/* padding も0にする。max-height だけだと下の余白9pxが残り、
   ヘッダーの高さが会場図の固定位置（--hdH＝上段の高さ）と9pxずれる。 */
header.hd.nav-hidden .jump{max-height:0; padding-top:0; padding-bottom:0; opacity:0;}
.jump a{font-size:13.5px; font-weight:600; color:rgba(255,255,255,.72);
        white-space:nowrap; padding:1px 0; border-bottom:2px solid transparent; transition:color .15s;}
.jump a.on{color:var(--yellow); border-bottom-color:var(--yellow); font-weight:700;}
/* --- ブランド帯（ビストロトッキー／トッキースクエア）-------------
   左右いっぱいの帯にする。ブロックで置くと「画像を貼った」ように見えるため。
   帯色とロゴの幅は店ごとに違うのでデータ側（brand.bg / brand.logoW）から与える。
   ビストロトッキーは縦横比 2.75:1、トッキースクエアは 9.7:1 と大きく違い、
   同じ幅で置くと片方が読めなくなるため。 */
.brandmark{display:flex;}
.brandmark .box{flex:1; display:flex; align-items:center; min-height:63px; padding:9px 16px;}
.brandmark img{height:auto;}

/* --- 実用情報（営業時間・売店・お支払い）------------------------
   枠で囲わず罫線だけ。一覧や販売エリアと様式を揃える。 */
.util{margin:18px 0 0;}
.util .row{display:flex; align-items:flex-start; gap:10px; padding:11px 16px; font-size:14.5px;
           border-top:1px solid var(--line);}
.util .row:last-child{border-bottom:1px solid var(--line);}
.util .k{flex:0 0 auto; font-weight:800; color:var(--navy); background:var(--yellow);
         padding:2px 8px; border-radius:5px; font-size:12.5px; white-space:nowrap; margin-top:2px;}
.util .v{color:#33404f; min-width:0;} .util .v b{color:var(--navy);}
.util a.link{color:var(--blue); font-weight:700; text-decoration:underline;}
.util .v .sub{display:block; margin-top:3px; font-size:13px; color:var(--muted);}
/* 「お支払いはキャッシュレスのみです」の一行。現金が使えないことは
   当日困る人が出るので、他の補足より強く見せる。
   ポップアップ（.pop）側にも同じ指定があり、あちらは各テンプレートが持つ。 */
.util .v .sub.short{font-weight:700; color:#33404f;}

/* --- アコーディオン ---------------------------------------------
   ページを開いた瞬間は要点だけを見せ、細かい説明はしまっておく。
   閉じているのが既定。JSが無効なら開いた状態のまま出す（読めなくしない）。 */
.acc-btn{display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:0;
         background:none; border:0; font:inherit; font-size:13px; font-weight:800;
         color:var(--blue); cursor:pointer;}
/* ▶ は開くと▼に回る。文字を読まなくても開閉が分かるようにするため。
   小さい三角なので、回転の中心がずれないよう inline-block で幅を持たせる。 */
.acc-btn .chev{display:inline-block; font-size:9px; line-height:1;
               transition:transform .2s;}
.acc-btn[aria-expanded="true"] .chev{transform:rotate(90deg);}
.acc-body{margin-top:6px;}
.js .acc-body[hidden]{display:none;}
.acc-body p{font-size:13.5px; color:#4b5563; line-height:1.75; margin-top:5px;}

/* --- スクロール表示 --------------------------------------------
   既定は「見えている」状態。画面外の要素にだけ JS が .pre を付けて隠す。
   こうしておけば JS が止まってもページが白紙にならない。 */
.rv{opacity:1; transform:none;}
.js .rv{transition:opacity .5s, transform .5s;}
.js .rv.pre{opacity:0; transform:translateY(12px);}
@media (prefers-reduced-motion:reduce){.js .rv,.js .rv.pre{opacity:1; transform:none; transition:none;}}

/* --- フッター：エンブレム＋著作権表示 ---------------------------
   色と文字サイズは homegame_lp/20260809/index.html の footer から写している。
   エンブレムはページの締めとして残す。外していたのは「クラブ公式HP」の
   リンクだけで、これは下部の固定ナビに同じ行き先のボタンが常に出ており、
   同じ画面で二度案内することになるため。
   エンブレムの丸は、LP側がインラインで背景と枠を消しているので付けない。 */
footer{margin-top:32px; background:var(--navy); color:#9db4cc; text-align:center;
       padding:14px 20px 15px; font-size:11px;}
footer .em{width:30px; height:30px; margin:0 auto 6px;
           background-size:contain; background-repeat:no-repeat; background-position:center;}

/* --- 下部に固定するナビ：ホームゲームLP本体の .sticky-cta と同じもの ------
   数値・色・比率はすべて LP のテンプレート（index.template.html）から
   そのまま写している。LP側を変えるときは、ここも同時に直す。
   position:sticky なので、スクロール中は画面下に貼り付き、
   ページ末尾では本文の流れの中に収まる。 */
.sticky-cta{position:sticky; bottom:0; z-index:50; background:var(--navy);
            padding:8px 12px; display:flex; gap:8px; align-items:stretch;
            border-top:3px solid var(--yellow);}
.sticky-cta a{flex:1 1 0; display:inline-flex; align-items:center; justify-content:center; gap:6px;
              font-weight:600; font-size:14px; text-decoration:none; min-height:44px; padding:4px 8px;
              border-radius:10px; white-space:nowrap; min-width:0;}
/* 画面幅に応じて文字が自動で少し縮む＝どの幅でも1行に収まる（折返し禁止） */
.sticky-cta a.sc-nav{flex:.8 1 0; background:transparent; color:#fff;
                     border:1.5px solid rgba(255,255,255,.55);
                     font-size:clamp(10.5px,3.2vw,12.5px); padding:4px 2px;}
.sticky-cta .sc-guide{background:transparent; color:#fff;
                      border:1.5px solid rgba(255,255,255,.55);
                      font-size:clamp(11px,3.4vw,13px); padding:4px 4px;}
.sticky-cta .sc-ticket{flex:1.25 1 0; background:var(--yellow); color:var(--navy); font-weight:700;
                       font-size:clamp(11.5px,3.6vw,14px);}
@media(max-width:420px){ .sticky-cta{gap:6px; padding:8px 8px;} }

/* ===== ここから下はグルメ詳細ページ固有の指定 =====
   色・書体・見出し・カード・番号バッジは共通トンマナ層（tone.css）が持つ。
   ここで上書きすると、グッズページとの間にズレが生まれるので足さない。 */
  .proto{background:var(--navy); color:#fff; font-size:11px; text-align:center; padding:6px 10px;}
  .proto b{color:var(--yellow);}

  /* 追従ヘッダー・切り替えセレクター・ページ内ナビは共通トンマナ層にある */
  /* ページ上部へ戻るボタン。ナビの端に置くと役割が違うものが混ざるため、
     右下に独立して置く。少しスクロールしてから現れる。 */
  /* 表示の切り替えは display で行う。opacity/visibility は環境によって
     効かないことがあり、以前ページが白紙になった原因でもあった。 */
  .fab{position:fixed; right:14px; bottom:82px; z-index:60; display:none;
       align-items:center; justify-content:center; width:46px; height:46px; border-radius:8px;
       background:rgba(255,255,255,.72); border:1px solid rgba(4,34,66,.16); color:var(--navy);
       -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
       box-shadow:0 2px 8px rgba(4,34,66,.12);}
  .fab.show{display:flex;}
  .fab svg{width:22px; height:22px; fill:currentColor; display:block;}
  @media(min-width:561px){ .fab{right:calc(50% - var(--maxw)/2 + 16px);} }

  /* どの試合の情報かを、英字見出しの横に小さく添える。
     和文見出しに混ぜると1行が長くなるので、ここに置いて行数を減らす。 */
  .head .disp .mt{font-family:var(--jp); font-size:13px; font-weight:700; color:var(--muted);
                  letter-spacing:0; text-transform:none; margin-left:9px;
                  position:relative; top:-3px;}
  /* 節間の余白だけページ側で決める。LP本体は帯の色で節が分かれるが、
     このページは白一色なので余白で分ける。見出しの組み方自体は共通層のまま。 */
  .head{padding-top:28px;} .head.first{padding-top:18px;}
  .sec{padding:30px 16px 0;} .sec.first{padding-top:22px;}
  /* ブランド帯（ビストロトッキー）の体裁は共通トンマナ層にある。
     グッズページと形がずれるので、ここで上書きしない。
     実用情報（営業時間・支払方法）は本文から外し、下の .pop で持っている。 */
  .ctx{font-size:13.5px; color:var(--muted); font-weight:600; padding:2px 20px 0;} .ctx b{color:var(--navy);}
  /* 見出しのすぐ下に置く断り書き。読み飛ばせる細さにしつつ、スマホで1行に収める。
     幅375pxの端末で使えるのは335px。いまの文言で321pxなので、長くすると2行になる。 */
  .ctx.note{font-weight:500; line-height:1.6; padding-top:6px;}

  /* 写真面：実写真(外部URL)。読めない時は絵文字＋暖色にフォールバック */
  .ph{position:relative; overflow:hidden; background:linear-gradient(150deg,#e9c9a7,#d7a273 55%,#b9743f);}
  .ph .demoji{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .ph .demoji span{font-size:52px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.18));}
  /* 写真は切り抜かず全体を見せる（object-fit:contain）。ホームゲームLP本体のカードも
     contain＋白地なので、見た目がそろう。cover にすると縦長・横長の写真が切れる。 */
  .ph .pimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
            background:#fff; z-index:1;}

  /* メニューの中の区分け（夏祭り／肉／定番）。節見出し（.head）と同じ体裁にすると
     見出しが2段続いて重くなるので、英字とアイコンは置かず、黄マーカーの和文だけにする。
     どこで区切れたかは余白でも示すため、上の余白を節間より少しだけ狭く取る。 */
  .mgroup{padding:24px 20px 2px;}
  /* 最初の1本は「メニュー」の見出しのすぐ下に来るので、間を詰めて
     見出しが2つ並んで見えないようにする。 */
  .mgroup:first-of-type{padding-top:6px;}
  /* バナーのある区分け。バナーはブランド帯と同じく紙の幅いっぱいに敷く。
     左右に余白を残すと「画像を貼った」ように見えて、帯として読めないため。 */
  .mgroup.has-bn{padding-left:0; padding-right:0;}
  .mgroup .mbn{display:block; width:100%; height:auto;}
  .mgroup .gh{font-size:21px; font-weight:900; line-height:1.4; color:var(--navy);
              display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .mgroup .gh .mk{background:linear-gradient(transparent 62%, var(--yellow) 62% 94%, transparent 94%);}

  /* ギャラリー：写真＋下に「名前・価格・説明文（原文）・店/エリア」を全表示 */
  /* 一覧：写真を主役にするため枠を外し、余白を詰めて写真を大きく取る。
     文字は 商品名＞価格＞説明＞店/番号 の順に弱めて階層をつくる。 */
  /* 写真と本文を1枚のカードに収める。境界がある方が、どの写真の説明かが
     確実に伝わる。体裁はLP本体のカードに合わせる。 */
  .gallery{display:grid; grid-template-columns:1fr 1fr; gap:14px 12px; padding:16px 16px 0;}
  .g-item{background:#fff; border:1px solid var(--card-bd); border-radius:var(--card-r); overflow:hidden;
          box-shadow:var(--card-sh); display:flex; flex-direction:column;}
  .g-item .ph{aspect-ratio:1/1;}
  .g-item .bd{padding:10px 11px 12px; display:flex; flex-direction:column; flex:1;}
  .g-item .nm{font-size:15px; font-weight:800; line-height:1.35; letter-spacing:-.01em;}
  /* 価格は控えめに。大きく出すと安売り感が出て食欲が下がる（指示書7.4） */
  .g-item .pr{font-size:13px; font-weight:700; color:#6a7482; margin-top:4px;}
  .g-item .ds{font-size:12.5px; color:#5b6472; margin-top:6px; line-height:1.55;}
  /* 販売場所：番号は会場図・店リストと同じ色分けバッジ（ネイビー=場外／黄=場内）。
     店名は控えめのまま。同じ店の商品が並ぶとき店名が目立つと繰り返しがうるさくなるため。 */
  .g-item .mt{display:flex; align-items:center; gap:6px; margin-top:auto; padding-top:9px;}
  .g-item .mt .no{width:18px; height:18px; font-size:10.5px;}
  .g-item .mt .sh{font-size:12px; color:#9aa4b1; font-weight:600; line-height:1.3;}
  .zoomable{cursor:zoom-in;}

  /* 販売エリアはカードで囲わず節として置き、会場図は左右いっぱいに使う */
  .area{margin:30px 0 0; scroll-margin-top:72px;}
  .area p{font-size:14.5px; color:#4b5563; padding:0 20px;}
  /* 凡例は色名を文字で書かず、実物と同じバッジを見せる。
     「赤＝場外」と書くと色覚や環境で伝わらないことがあるため。 */
  .area .legend{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-weight:700; color:var(--navy);}
  .area .legend .no{width:19px; height:19px; font-size:11px;}
  .area .legend .sp{display:inline-block; width:6px;}
  /* 会場図を貼り付けたまま店リストをスクロールさせる。
     番号とお店を突き合わせながら読めるようにするため。 */
  .area .maparea{margin-top:14px; position:sticky; top:var(--hdH,96px); z-index:20; background:#fff;
                 box-shadow:0 6px 12px -8px rgba(4,34,66,.25);}
  /* PC：会場図を大きく見せたいので固定はせず、通常の流れで表示する。
     画面が広く、図とリストを行き来するコストが小さいため。 */
  @media(min-width:561px){
    .area .maparea{position:static; box-shadow:none;}
  }
  .area .mapbox{background:#fff;}
  .area .mapbox img{display:block; width:100%; height:auto;}
  /* 番号ピン：画像に焼き込まず、座標データからHTMLで重ねる。
     毎試合は JSON の areas を直すだけでよく、画像編集は不要。 */
  .mapstage{position:relative; line-height:0;}
  /* 会場図の注釈（開放ゲートなど）。図の上に重ねず、すぐ下に1行で置く。
     図に重ねると番号や方位磁針に重なり、小さくて読みにくいため。
     文言は JSON の maps[].onimage で毎試合変えられる。 */
  .mapnote{margin:8px 16px 0; font-size:13px; font-weight:700; color:var(--navy); line-height:1.5;}
  /* 大きさは 5.2%→4.2%。担当者の配置資料（位置参考資料.pdf）どおりに並べると
     隣どうしが 57px（図の原寸）まで詰まる箇所があり、5.2%では重なって番号が読めない。
     資料の位置を動かさずに済むところまで細くしてある。 */
  .pin{position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
       width:4.2%; aspect-ratio:1; border-radius:50%;
       background:var(--pin-out-bg); color:var(--pin-out-fg);
       box-shadow:0 1px 3px rgba(0,0,0,.3); border:1.5px solid var(--pin-out-bd);}
  /* 丸数字（①）は二重丸になり、環境によって斜体で描画されるため使わない。
     ピンの円＋算用数字で表示する。 */
  .pin b{font: 900 clamp(8px, 2.1vw, 14px)/1 'Helvetica Neue', Arial, sans-serif;
         font-style:normal; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
         transform:translateY(.02em);}
  .pin.in{background:var(--pin-in-bg); color:var(--pin-in-fg); border-color:var(--pin-in-bd);}
  /* 店舗一覧もカードで囲わない。場外／場内で分け、番号順に並べる */
  .gatelist{margin-top:20px; display:flex; flex-direction:column; gap:18px;}
  /* 区分見出しは黄色のベタ塗りをやめ、見出しと同じ黄色マーカーにする。
     場内バッジが黄色の丸になったため、塗りが2種あると見分けがつかなくなる。 */
  .gatelist .gz{display:inline-block; margin:0 20px 8px; font-size:13.5px; font-weight:900; color:var(--navy);
                background:linear-gradient(transparent 58%, var(--yellow) 58% 94%, transparent 94%); padding:0 3px;}
  .gatelist .row{display:flex; gap:9px; padding:10px 16px; border-top:1px solid var(--line);}
  .gatelist .row:last-child{border-bottom:1px solid var(--line);}
  .gatelist .shopnm{font-size:14.5px; font-weight:800; color:var(--navy); line-height:1.35;}
  .gatelist .menu{font-size:13px; color:#5b6472; line-height:1.6; margin-top:2px;}
  /* リストの番号は会場図のピンと同じ見た目に揃える（ネイビー=場外／黄=場内） */
  .gatelist .no{width:21px; height:21px; margin-top:1px; font-size:12px;}

  /* スクロール表示（.rv）の定義は共通トンマナ層にある */

  #lb{position:fixed; inset:0; background:rgba(4,34,66,.92); display:none; align-items:center; justify-content:center; z-index:80; padding:24px;}
  #lb.on{display:flex;} #lb .box{width:100%; max-width:420px;}
  /* 横長マップ：原寸で表示し、指でずらして読めるようにする（縮小して読めなくしない） */
  #lb .big{position:relative; aspect-ratio:4/5; border-radius:14px; overflow:hidden; background:linear-gradient(150deg,#e9c9a7,#b9743f);}
  #lb .big .demoji{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;} #lb .big .demoji span{font-size:120px;}
  #lb .big img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#0a1a2e;}
  #lb .lbcap{color:#fff; text-align:center; margin-top:14px; font-weight:800; font-size:18px;}
  #lb .lbcap small{display:block; font-weight:600; color:#c7d3e4; font-size:13.5px; margin-top:4px;}
  #lb .x{position:absolute; top:16px; right:18px; color:#fff; font-size:26px; font-weight:700; cursor:pointer;}

  /* PCの器（グレー地＋680pxの紙＋影）は共通トンマナ層が持つ。
     LP本体と同じ 601px で切り替わる。ここでは何も足さない。 */

  /* --- 営業時間・支払方法のポップアップ ---------------------------
     グッズB案と同じ扱い。本文の頭に置くと、料理を見に来た人の前に
     実用情報が挟まって目的に届くまでが遠くなるので、必要な人だけが
     2段目のメニューから開く形にした。行の体裁（黄色の見出しラベル）は
     共通トンマナ層の .util と揃えてある。 */
  .pop{position:fixed; inset:0; z-index:110; display:none;}
  .pop.on{display:block;}
  .pop .veil{position:absolute; inset:0; background:rgba(4,34,66,.45); opacity:0; transition:opacity .2s;}
  .pop.in .veil{opacity:1;}
  .pop .box{position:absolute; left:50%; top:50%; transform:translate(-50%,-46%) scale(.96);
            width:min(92%, 420px); max-height:80%; overflow:auto; background:#fff; border-radius:16px;
            padding:18px 18px 20px; opacity:0; transition:opacity .2s, transform .2s;}
  .pop.in .box{transform:translate(-50%,-50%) scale(1); opacity:1;}
  .pop h3{font-size:17px; font-weight:900; color:var(--navy); margin-bottom:10px;}
  .pop .row{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:14px;}
  .pop .row .k{flex:0 0 auto; font-weight:800; color:var(--navy); background:var(--yellow);
               padding:2px 8px; border-radius:5px; font-size:12.5px; white-space:nowrap; height:fit-content;}
  .pop .row .v{color:#33404f; min-width:0;} .pop .row .v b{color:var(--navy);}
  .pop .row .v .sub{display:block; margin-top:3px; font-size:12.5px; color:var(--muted);}
  /* 現金が使えないことは当日困る人が出るので、他の補足より強く見せる（共通層と同じ扱い） */
  .pop .row .v .sub.short{font-weight:700; color:#33404f;}
  .pop .row .v a.link{color:var(--blue); font-weight:700; text-decoration:underline;}
  .pop .close{margin-top:14px; width:100%; padding:10px; border:0; border-radius:10px; cursor:pointer;
              background:var(--navy); color:#fff; font-weight:700; font-size:14px;}

/* ヘッダー下段(ページ内メニュー)だけ自動非表示: 上段のタブ(ホームゲーム/グルメ/グッズ)は常に表示 */
.hd .jump{transition:max-height .4s ease, opacity .4s ease; overflow:hidden; max-height:80px}
.hd.qhide .jump{max-height:0; opacity:0}
</style>

  // メニューは公式ニュースと同じ区分けで並べる。区分けは JSON の sections が持つので、
  // 毎試合その中身を変えるだけでよい。section が無い品は最後にまとめて出す。
  (function(){
    var secs = DATA.sections || [];
    var rest = DATA.items.filter(function(it){
      return !secs.some(function(s){ return s.key===it.section; });
    });
    var html = secs.map(function(s){
      var list = DATA.items.filter(function(it){ return it.section===s.key; });
      if(!list.length) return '';
      // バナーがある区分けは、バナー自体が見出しなので黄マーカーの文字は出さない。
      // 同じ言葉が画像と文字で二度続くため。品数だけは残す。
      var head = s.banner
        ? '<img class="mbn" src="'+esc(s.banner)+'" alt="'+esc(s.name)+'" loading="lazy">'
        : '<h3 class="gh"><span class="mk">'+esc(s.name)+'</span></h3>';
      return '<div class="mgroup rv'+(s.banner?' has-bn':'')+'">'+head+'</div>'+
             '<div class="gallery">'+list.map(card).join('')+'</div>';
    }).join('');
    if(rest.length) html += '<div class="gallery">'+rest.map(card).join('')+'</div>';
    document.getElementById('menu').innerHTML = html;
  })();

  // 会場マップ（タップで全画面拡大）。maps に入れた枚数だけ並ぶ
  (function(){
    var w=document.getElementById('mapWrap'); if(!w) return;
    var maps=DATA.maps||(DATA.map?[DATA.map]:[]);
    if(!maps.length) return;
    w.innerHTML = maps.map(function(m){
      return '<div class="mapbox">'+
        '<div>'+
          '<div class="mapstage">'+
            '<img src="'+esc(m.img)+'" alt="'+esc(m.caption||'会場マップ')+'" loading="lazy">'+
            pinsHTML()+
          '</div>'+
          // 注記は図の上に重ねず、図のすぐ下に1行で置く。
          // 図の中に置くと番号や方位磁針に重なるうえ、小さくて読みにくい。
          (m.onimage ? '<p class="mapnote">'+esc(m.onimage)+'</p>' : '')+
        '</div>'+
      '</div>';
    }).join('');
  })();

  // 試合の一行。「ホームゲーム」は、このページに来ている時点で伝わっているので書かない。
  // 日付も 8.9 SUN のような英字表記にせず、日本語のまま素直に出す。
  // 文言をHTMLに直書きせず match から組み立てる（毎試合ここを直さなくてよい）。
  (function(){
    var el=document.getElementById('ctxLine'); if(!el) return;
    var m=DATA.match||{};
    if(!m.date && !m.opponent){ el.remove(); return; }
    var txt='';
    if(m.date){
      var p=String(m.date).split('-');
      var dt=new Date(+p[0], +p[1]-1, +p[2]);
      var dow='日月火水木金土'[dt.getDay()];
      txt+='<b>'+(+p[1])+'月'+(+p[2])+'日（'+dow+'）</b>';
    }
    if(m.opponent) txt+=(txt?' ':'')+'vs '+esc(m.opponent);
    // 会場名は書かない。ホームゲームLPから来た時点で分かっているため。
    el.innerHTML=txt;
  })();

  // 実用情報（営業時間・お支払い）。毎試合 JSON を直せば表示が変わる。
  // 本文の頭には出さず、2段目のメニューからポップアップで開く（グッズB案と同じ扱い）。
  // 開くのは必要な人だけなので、本文にあったときのアコーディオンはやめて
  // 決済方法の詳細も最初から全部見せている。
  (function(){
    var pop=document.getElementById('pop'), body=document.getElementById('popBody');
    var btn=document.getElementById('openInfo');
    if(!pop||!btn) return;
    var h=DATA.hours||{}, p=DATA.payment||{}, html='<h3>営業時間と支払方法</h3>';
    if(h.outside || h.inside){
      var parts=[];
      if(h.outside) parts.push('場外 <b>'+esc(h.outside)+'</b>');
      if(h.inside)  parts.push('場内 <b>'+esc(h.inside)+'</b>');
      html+='<div class="row"><span class="k">営業時間</span><span class="v">'+parts.join(' ／ ')+'</span></div>';
    }
    if(p.lead || p.short || p.body){
      html+='<div class="row"><span class="k">お支払い</span><span class="v">'+
        (p.lead? '<b>'+esc(p.lead)+'</b>' : '')+
        (p.short? '<span class="sub short">'+esc(p.short)+'</span>' : '')+
        (p.body? '<span class="sub">'+esc(p.body)+'</span>' : '')+
        (p.note? '<span class="sub">'+esc(p.note)+'</span>' : '')+
        (p.guideUrl? '<span class="sub"><a class="link" href="'+esc(p.guideUrl)+'">決済のくわしくは観戦ガイドへ</a></span>' : '')+
        '</span></div>';
    }
    body.innerHTML=html;
    function open(e){ if(e) e.preventDefault();
      pop.classList.add('on'); void pop.querySelector('.box').offsetHeight; pop.classList.add('in'); }
    function close(){ pop.classList.remove('in'); setTimeout(function(){ pop.classList.remove('on'); },220); }
    btn.addEventListener('click', open);
    pop.addEventListener('click', function(e){ if(e.target.closest('[data-popclose]')) close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape' && pop.classList.contains('on')) close(); });
  })();

  // ブランドロゴ（ビストロトッキー）
  (function(){
    var el=document.getElementById('brandmark');
    if(!el || !DATA.brand || !DATA.brand.logo){ if(el) el.remove(); return; }
    // 帯の色はブランドごとに違うのでデータから与える（グッズ＝トッキースクエアも同じ形）
    el.innerHTML='<span class="box" style="background:'+esc(DATA.brand.bg||'#F4D14D')+'">'+
      '<img src="'+esc(DATA.brand.logo)+'" alt="'+esc(DATA.brand.name+'（'+(DATA.brand.sub||'')+'）')+'" '+
      'style="width:'+esc(DATA.brand.logoW||'124px')+'; max-width:'+esc(DATA.brand.logoMax||'38%')+'"></span>';
  })();

  // 丸数字（①㉑…）→ 算用数字（1, 21…）。ピンの中では二重丸を避けるため数字だけを使う。
  function numOf(s){
    var c=(s||'').charCodeAt(0);
    if(c>=0x2460 && c<=0x2473) return String(c-0x2460+1);   // ①〜⑳
    if(c>=0x3251 && c<=0x325F) return String(c-0x3251+21);  // ㉑〜㉟
    return s;
  }

  // 番号ピンのHTML（会場図に重ねる）
  function pinsHTML(){
    if(!DATA.areas) return '';
    return DATA.areas.filter(function(a){ return typeof a.x==='number' && typeof a.y==='number'; })
      .map(function(a){
        return '<i class="pin'+(a.zone==='場内'?' in':'')+'" style="left:'+(a.x*100).toFixed(2)+'%;top:'+(a.y*100).toFixed(2)+'%" '+
               'title="'+esc(a.no+' '+(a.shop||''))+'"><b>'+numOf(a.no)+'</b></i>';
      }).join('');
  }

  // 店舗一覧。場外／場内で分け、あとは番号順に並べるだけ。
  // 「手前」「付近」などの距離感は人によって受け取り方が違うため文章では書かず、
  // 番号と会場図でおおよその位置を伝える。
  (function(){
    var el=document.getElementById('gatelist'); if(!el||!DATA.areas) return;
    var html='';
    ['場外','場内'].forEach(function(z){
      var list=DATA.areas.filter(function(a){ return a.zone===z; });
      if(!list.length) return;
      html+='<div><span class="gz">'+z+'エリア</span>'+
        list.map(function(a){
          // その番号で買えるものは、掲載中の商品から自動で拾う（データの二重管理を避ける）
          var menu=DATA.items.filter(function(it){ return it.zone===a.zone && it.area===a.no; })
                             .map(function(it){ return it.name; });
          return '<div class="row">'+
            '<span class="no'+(z==='場内'?' in':'')+'">'+numOf(a.no)+'</span>'+
            '<div><div class="shopnm">'+esc(a.shop||'')+'</div>'+
            (menu.length? '<div class="menu">'+esc(menu.join('／'))+'</div>' : '')+
            '</div></div>';
        }).join('')+
        '</div>';
    });
    el.innerHTML=html;
  })();

  // ヘッダーの実高さを CSS 変数に入れる（追従する会場図の位置合わせに使う）
  (function(){
    var hd=document.querySelector('header.hd'); if(!hd) return;
    function set(){
      // 帯は畳まれると高さが変わる。変わらない上段の高さを基準にする。
      // ヘッダー全体の高さで測ると、畳まれた瞬間に固定位置がずれて
      // 「一度固定されたのに、また固定し直される」動きになる。
      var top=hd.querySelector('.hd-in');
      var h=Math.round((top||hd).getBoundingClientRect().height);
      document.documentElement.style.setProperty('--hdH', h+'px');
      document.querySelectorAll('.sec, .area').forEach(function(e){ e.style.scrollMarginTop=(h+8)+'px'; });
    }
    set(); addEventListener('resize', set); addEventListener('load', set);
  })();

  // 「上へ戻る」ボタンは、少しスクロールしてから現れる
  (function(){
    var fab=document.getElementById('fab'); if(!fab) return;
    function upd(){ fab.classList.toggle('show', window.scrollY > window.innerHeight); }
    addEventListener('scroll', upd, {passive:true}); addEventListener('resize', upd); upd();
    fab.addEventListener('click', function(ev){
      ev.preventDefault();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  })();

  // ページ内移動：今見ている節をナビでハイライトする
  (function(){
    // 「営業時間・支払方法」はポップアップを開くボタンで href="#" のため節を持たない。
    // 混ぜると querySelector('#') で例外になり、ハイライトごと止まる。
    var links=[].slice.call(document.querySelectorAll('.jump a[href^="#"]:not(.totop)'))
                .filter(function(a){ return a.getAttribute('href').length>1; });
    if(!links.length) return;
    var secs=links.map(function(a){ return document.querySelector(a.getAttribute('href')); });
    function upd(){
      var y=window.scrollY+(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hdH'))||96)+20;
      var cur=-1;
      secs.forEach(function(s,i){ if(s && s.offsetTop<=y) cur=i; });
      links.forEach(function(a,i){ a.classList.toggle('on', i===cur); });
    }
    addEventListener('scroll', upd, {passive:true}); upd();
  })();


// どの試合のページかを英字見出しの横に添える。
// 戻るボタンは「どこへ行くか」だけを言う役に徹する。
(function(){
  var m=DATA.match||{}, t=document.getElementById('titleMatch');
  if(!t || !m.date) return;
  var p=String(m.date).split('-'), name=m.short||m.opponent||'';
  t.textContent='（'+(+p[1])+'月'+(+p[2])+'日'+(name?name+'戦':'')+'）';
})();
  document.documentElement.classList.add('js');

  /* ===========================================================
   追従ヘッダーの共通の動き（グルメ・グッズ共用）
   -----------------------------------------------------------
   build_gourmet.mjs / build_goods.mjs がテンプレートの
   __NAV__ 目印にこの中身を差し込む。
   ページごとに書き分けると必ずズレるので、1か所にまとめている。
   =========================================================== */

// --- ページ内ナビの帯を、下に読み進めているあいだは畳む -----------
// 本文の見える面積を増やすため。上へ戻る動きをしたら、行き先を探して
// いる合図とみなしてすぐ出す。
// 行き先へ飛んでいる最中は畳まない（飛んだ先で帯が消えると、
// 今どこにいるのかが分からなくなるため）。
var NAV_LOCK_UNTIL = 0;
(function(){
  var hd = document.querySelector('header.hd');
  if(!hd) return;
  var last = window.pageYOffset;

  // 帯を畳むとヘッダーの高さが変わり、本文がその分だけ上下する。
  // ブラウザはこれもスクロールとして通知してくるため、素直に向きを見ると
  // 「畳む→本文が上がる→上向きと判定→戻す→本文が下がる→畳む」を
  // 繰り返して震える。切り替えた直後の短いあいだは判定を止める。
  function set(hidden){
    if(hd.classList.contains('nav-hidden') === hidden) return;
    hd.classList.toggle('nav-hidden', hidden);
    NAV_LOCK_UNTIL = Date.now() + 320;   // ずらす動き（0.22秒）が終わるまで
  }

  addEventListener('scroll', function(){
    var y = window.pageYOffset;
    if(Date.now() < NAV_LOCK_UNTIL){ last = y; return; }
    if(y < 90)             set(false);   // 最上部では必ず出す
    else if(y > last + 8)  set(true);    // 下へ読み進めている
    else if(y < last - 8)  set(false);   // 上へ戻っている
    last = y;
  }, {passive:true});
})();

// --- ページ内ナビの飛び先 ----------------------------------------
// CSSの scroll-margin だけだと、追従ヘッダーの高さが畳んだ状態で
// 変わるため、見出しが半分隠れた中途半端な位置で止まることがある。
// クリック時に実際のヘッダー高さを測って、その分だけ手前に止める。
(function(){
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('.jump a[href^="#"]') : null;
    if(!a) return;
    // ページ内ナビには「営業時間・支払方法」のように節を持たない href="#" のボタンも並ぶ。
    // そのまま querySelector('#') に渡すと例外になり、ここから下が全部止まる。
    var href = a.getAttribute('href');
    if(!href || href.length < 2) return;
    var t = document.querySelector(href);
    if(!t) return;
    e.preventDefault();
    var hd = document.querySelector('header.hd');
    if(hd) hd.classList.remove('nav-hidden');
    NAV_LOCK_UNTIL = Date.now() + 900;   // 飛んでいる最中は畳まない
    var h = hd ? hd.offsetHeight : 0;
    var top = t.getBoundingClientRect().top + window.pageYOffset - h - 12;
    window.scrollTo({ top: Math.max(0, top), behavior:'smooth' });
  });
})();


  (function(){
    var els=[].slice.call(document.querySelectorAll('.rv'));
    function showAll(){ els.forEach(function(e){ e.classList.remove('pre'); }); }

    // 動きを減らす設定・IntersectionObserver 非対応・非表示タブでの描画時は
    // アニメーションを使わず、そのまま表示する
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce || !('IntersectionObserver' in window) || document.visibilityState !== 'visible'){ return; }

    // 画面外の要素にだけ .pre を付けて隠す（画面内は最初から見えている）
    var vh = window.innerHeight;
    els.forEach(function(e){ if(e.getBoundingClientRect().top > vh*0.9) e.classList.add('pre'); });

    var io=new IntersectionObserver(function(en){
      en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.remove('pre'); io.unobserve(x.target); } });
    },{rootMargin:'0px 0px -5% 0px'});
    els.forEach(function(e){ if(e.classList.contains('pre')) io.observe(e); });

    // 【保険】何らかの理由で reveal が走らなくても、隠したままにしない
    function revealInView(){
      els.forEach(function(e){
        if(!e.classList.contains('pre')) return;
        if(e.getBoundingClientRect().top < window.innerHeight*1.15){ e.classList.remove('pre'); io.unobserve(e); }
      });
    }
    addEventListener('scroll', revealInView, {passive:true});
    addEventListener('resize', revealInView);
    addEventListener('pageshow', revealInView);
    document.addEventListener('visibilitychange', function(){ if(document.hidden) showAll(); else revealInView(); });
    setTimeout(showAll, 5000);
  })();

  (function(){
    var lb=document.getElementById('lb'), big=lb.querySelector('.big'), nm=document.getElementById('lbnm');
    document.addEventListener('click',function(ev){
      // 「会場マップで見る ›」→ 販売エリア節へ移動してマップを開く
      var ml=ev.target.closest('[data-map]');
      if(ml){
        ev.preventDefault();
        var sec=document.getElementById('areaSec');
        if(sec) sec.scrollIntoView({block:'start'});
        return;
      }
      var z=ev.target.closest('.zoomable');
      if(!z){ if(ev.target.closest('#lb')){ lb.classList.remove('on','wide','zoom'); } return; }
      var img=z.dataset.img;
      big.innerHTML = '<div class="demoji"><span>'+(z.dataset.e||'🍽')+'</span></div>'+(img?'<img src="'+img+'" onerror="this.remove()">':'');
      nm.innerHTML=(z.dataset.nm||'')+'<small>タップで拡大</small>';
      lb.classList.add('on');
    });
  })();
</script>
<script>
/* ヘッダー自動非表示（LPと同じタイミング: 猶予260px・0.4s） */
(function(){
  var hd=document.querySelector('header.hd'); if(!hd) return;
  var GRACE=260, last=window.scrollY, anchor=null;
  addEventListener('scroll',function(){
    var y=window.scrollY;
    if(y<10 || y<last-2){
      hd.classList.remove('qhide');
      anchor=y;
    }else if(y>last+2){
      if(hd.getBoundingClientRect().top<=0){
        if(anchor===null) anchor=y;
        if(y>anchor+GRACE){ hd.classList.add('qhide'); }
      }else{ anchor=null; }
    }
    last=y;
  },{passive:true});
})();
</script>
