<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>スタジアムグッズ｜栃木SC ホームゲーム 8/9 vs 金沢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ホームゲームLP本体と同じ3書体。グルメと同じ読み込み。 -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   共通トンマナ層 ─ ホームゲームLP本体から抜き出した「見た目の土台」
   -----------------------------------------------------------
   【役割】
   グルメ／グッズ詳細ページは、ホームゲームLPの1つの節を展開した
   派生ページである。別サイトに見えてはいけない。
   そのため、色・書体・見出しの組み方・カードの体裁といった
   「同じサイトだと分かる部分」は、ここ1か所だけで定義する。

   【出どころ】
   すべて homegame_lp/20260809/index.html の実装値をそのまま写している。
   数値を勝手に変えないこと。変えるならLP本体と同時に変える。

   【使い方】
   build_gourmet.mjs がテンプレートの __TONE__ 目印にこの中身を差し込む。
   ページは1枚のHTMLとして完結する（CSSファイルの読み込み事故が起きない）。
   ※この目印をコメント内に「スラッシュ＋アスタリスク」の形で書かないこと。
     CSSのコメントは入れ子にできず、そこでコメントが終わってしまう。

   【Webフォント】
   Anton / Poppins / Noto Sans JP の読み込みは各テンプレートの <head> に置く。
   ここはCSSなので <link> を書けない。3書体そろって初めてLPと同じ見た目になる。
   =========================================================== */

:root{
  /* --- ブランド色（LP本体と同一）。ここに無い色を足さない --- */
  --yellow:#FFEA00; --blue:#004D9F; --navy:#042242; --white:#FFFFFF;
  --ink:#042242; --paper:#FFFCE8;
  --line:#E4E8EE;
  --muted:#6a7482;

  /* --- 書体（LP本体と同一）--- */
  --disp:'Anton',sans-serif;          /* 英字見出し。ページの顔 */
  --latin:'Poppins',sans-serif;       /* 英字の小さい文字・価格 */
  --jp:'Noto Sans JP',sans-serif;     /* 和文。端末依存にしない */

  /* --- 器 --- */
  --page:#EDEFF2; --maxw:680px;

  /* --- カード（LP本体 .rail .card と同一）--- */
  --card-r:16px; --card-bd:#E7EAF0; --card-sh:0 4px 16px rgba(4,34,66,.12);
  --r-btn:6px;

  /* --- 番号バッジ：場外／場内の区別 -------------------------
     LP本体に赤は1色も使われていないため、赤（#DB0025）は廃止した。
     ネイビー塗り＝場外、黄色塗り＝場内。スタジアムの中に入ると
     チームカラーになる、という対応で覚えられる。
     どちらもLP本体にある配色（.hero .op-jp / .sp-body .tag）。 */
  --pin-out-bg:var(--navy);   --pin-out-fg:#fff;     --pin-out-bd:#fff;
  --pin-in-bg:var(--yellow);  --pin-in-fg:var(--navy); --pin-in-bd:var(--navy);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth;}
body{
  font-family:var(--jp); color:var(--ink); background:#fff;
  -webkit-font-smoothing:antialiased;
  font-size:16px; line-height:1.8;   /* LP本体と同じ行間。詰めない */
  overflow-x:hidden;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}

/* --- 器：LP本体の .device と同じ挙動 ---------------------------
   スマホ＝白の全幅。PC＝グレー地に680pxの紙が浮く。
   LPから来たときに幅と佇まいが変わらないようにするため。 */
.wrap{max-width:var(--maxw); margin:0 auto; background:#fff; position:relative;}
@media(min-width:601px){
  body{background:var(--page); padding:0 16px 60px;}
  .wrap{box-shadow:0 2px 20px rgba(4,34,66,.08);}
}

/* --- 見出し：LP本体の .head と同じ組み方 -----------------------
   英字（Anton・31px・ネイビー）が主役で1行目に立ち、
   その下にアイコン＋和文＋黄色マーカー。この順序がLPの顔。
   英字を小さな飾りに落とすと、途端に別サイトに見える。 */
.head{padding:15px 20px 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.head .disp{
  width:100%; order:-1;
  font-family:var(--disp); font-weight:400; font-size:31px; line-height:1;
  letter-spacing:.03em; color:var(--navy); margin-bottom:7px; text-transform:uppercase;
}
.head .hicon{flex:none; width:30px; height:30px; color:var(--navy);}
.head .hicon svg{width:30px; height:30px; stroke:currentColor; stroke-width:1.7; fill:none;
                 stroke-linecap:round; stroke-linejoin:round;}
.head h2{font-size:22px; font-weight:900; line-height:1.3; color:var(--navy);
         display:inline-block; position:relative;}
/* 黄色マーカーは文字を包んで引く（下線ではなく蛍光ペン）。文字数に追従する */
.head h2 .mk{background:linear-gradient(transparent 60%, var(--yellow) 60% 92%, transparent 92%);
             padding:0 2px;}
.head .cnt{font-size:13px; color:var(--muted); font-weight:700;}
.subbrand{font-family:var(--latin); color:var(--navy); font-size:12px; font-weight:700;
          letter-spacing:.1em; margin-left:10px; align-self:baseline; padding-top:8px; white-space:nowrap;}
.slead{color:#333; font-size:14px; padding:6px 20px 0;}

/* --- 節の区切り：中央に黄色の短い棒（LP本体 .sec-div）--- */
.sec-div{position:relative; height:1px; background:var(--line); margin:26px 20px 8px;}
.sec-div::before{content:""; position:absolute; left:50%; top:-1.5px; transform:translateX(-50%);
                 width:40px; height:4px; border-radius:2px; background:var(--yellow);}

/* --- 帯（LP本体と同じ4種）--- */
.band-white{background:#fff;}
.band-soft{background:#F7F9FC;}
.band-paper{background:var(--paper);}
.band-yellow{background:var(--yellow);}

/* --- カード：LP本体 .rail .card と同一の体裁 --- */
.card{background:#fff; border:1px solid var(--card-bd); border-radius:var(--card-r);
      overflow:hidden; box-shadow:var(--card-sh); display:flex; flex-direction:column;}

/* --- 番号バッジ（会場図のピン・店リストの番号で共用）-----------
   丸数字（①）は環境によって二重丸や斜体で描画されるため使わない。
   円＋算用数字で描く。数字の幅を揃えるため tabular-nums を指定。 */
.no{flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; background:var(--pin-out-bg); color:var(--pin-out-fg);
    font-family:'Helvetica Neue',Arial,sans-serif; font-weight:900; font-style:normal;
    font-variant-numeric:tabular-nums; line-height:1;}
.no.in{background:var(--pin-in-bg); color:var(--pin-in-fg);}

/* --- 追従ヘッダー -----------------------------------------------
   LP本体の .qnav と同じネイビー地。下の黄色線は、すぐ下にくる
   ブランド帯（黄色）と二重の帯に見えるため引かない。 */
header.hd{position:sticky; top:0; z-index:40; background:var(--navy);}
.hd-in{position:relative; display:flex; align-items:center; justify-content:space-between;
       gap:10px; padding:9px 14px;}
/* エンブレムは帯の中央。左右の要素の間に挟むと幅が足りずに押し合うので、
   重ねて中央に置く。帯の高さは変えない。 */
.hd-in .emblem{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
               width:26px; height:26px; pointer-events:none;}
.back{font-size:14.5px; color:#fff; font-weight:700; white-space:nowrap;}

/* グルメ⇄グッズの切り替え。枠線を引かず、薄い地の上に「つまみ」を置く形。
   選択中がどちらかを、線ではなく面で示す。 */
.seg{display:flex; align-items:center; gap:2px; padding:3px;
     background:rgba(255,255,255,.15); border-radius:999px;
     font-size:13.5px; font-weight:800;}
.seg a{padding:5px 14px; border-radius:999px; color:rgba(255,255,255,.72); background:transparent;
       transition:background .15s, color .15s;}
.seg a.on{background:var(--yellow); color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.18);}

/* ページ内移動。ネイビー地の上では黄色マーカーが読めないので、
   現在地は黄色の文字＋下線で示す。LPの .qnav a:hover と同じ考え方。 */
.jump{display:flex; align-items:center; gap:20px; padding:0 16px 9px;
      overflow:hidden; transition:max-height .22s ease, opacity .18s ease; max-height:44px;}
/* 上段（戻る・グルメ⇄グッズ）は常に出したまま、ページ内ナビの帯だけ畳んで
   本文の見える面積を増やす。畳むと高さが変わり、その分だけ本文が動くが、
   その動きを「上へのスクロール」と誤って読まないよう、切り替え直後の
   短いあいだは判定を止めている（nav.js）。 */
/* padding も0にする。max-height だけだと下の余白9pxが残り、
   ヘッダーの高さが会場図の固定位置（--hdH＝上段の高さ）と9pxずれる。 */
header.hd.nav-hidden .jump{max-height:0; padding-top:0; padding-bottom:0; opacity:0;}
.jump a{font-size:13.5px; font-weight:800; color:rgba(255,255,255,.72);
        white-space:nowrap; padding:1px 0; border-bottom:2px solid transparent; transition:color .15s;}
.jump a.on{color:var(--yellow); border-bottom-color:var(--yellow);}
/* --- ブランド帯（ビストロトッキー／トッキースクエア）-------------
   左右いっぱいの帯にする。ブロックで置くと「画像を貼った」ように見えるため。
   帯色とロゴの幅は店ごとに違うのでデータ側（brand.bg / brand.logoW）から与える。
   ビストロトッキーは縦横比 2.75:1、トッキースクエアは 9.7:1 と大きく違い、
   同じ幅で置くと片方が読めなくなるため。 */
.brandmark{display:flex;}
.brandmark .box{flex:1; display:flex; align-items:center; min-height:63px; padding:9px 16px;}
.brandmark img{height:auto;}

/* --- 実用情報（営業時間・売店・お支払い）------------------------
   枠で囲わず罫線だけ。一覧や販売エリアと様式を揃える。 */
.util{margin:18px 0 0;}
.util .row{display:flex; align-items:flex-start; gap:10px; padding:11px 16px; font-size:14.5px;
           border-top:1px solid var(--line);}
.util .row:last-child{border-bottom:1px solid var(--line);}
.util .k{flex:0 0 auto; font-weight:800; color:var(--navy); background:var(--yellow);
         padding:2px 8px; border-radius:5px; font-size:12.5px; white-space:nowrap; margin-top:2px;}
.util .v{color:#33404f; min-width:0;} .util .v b{color:var(--navy);}
.util a.link{color:var(--blue); font-weight:700; text-decoration:underline;}
.util .v .sub{display:block; margin-top:3px; font-size:13px; color:var(--muted);}

/* --- アコーディオン ---------------------------------------------
   ページを開いた瞬間は要点だけを見せ、細かい説明はしまっておく。
   閉じているのが既定。JSが無効なら開いた状態のまま出す（読めなくしない）。 */
.acc-btn{display:inline-flex; align-items:center; gap:5px; margin-top:6px; padding:0;
         background:none; border:0; font:inherit; font-size:13px; font-weight:800;
         color:var(--blue); cursor:pointer;}
/* ▶ は開くと▼に回る。文字を読まなくても開閉が分かるようにするため。
   小さい三角なので、回転の中心がずれないよう inline-block で幅を持たせる。 */
.acc-btn .chev{display:inline-block; font-size:9px; line-height:1;
               transition:transform .2s;}
.acc-btn[aria-expanded="true"] .chev{transform:rotate(90deg);}
.acc-body{margin-top:6px;}
.js .acc-body[hidden]{display:none;}
.acc-body p{font-size:13.5px; color:#4b5563; line-height:1.75; margin-top:5px;}

/* --- スクロール表示 --------------------------------------------
   既定は「見えている」状態。画面外の要素にだけ JS が .pre を付けて隠す。
   こうしておけば JS が止まってもページが白紙にならない。 */
.rv{opacity:1; transform:none;}
.js .rv{transition:opacity .5s, transform .5s;}
.js .rv.pre{opacity:0; transform:translateY(12px);}
@media (prefers-reduced-motion:reduce){.js .rv,.js .rv.pre{opacity:1; transform:none; transition:none;}}

/* ===== ここから下はグッズ詳細ページ固有の指定 =====
   色・書体・見出し・カード・番号バッジは共通トンマナ層（tone.css）が持つ。
   グルメページと形がずれるので、ここで上書きしない。 */

  /* 節間の余白。グルメページと同じ扱い */
  .head{padding-top:28px;} .head.first{padding-top:18px;}
  .ctx{font-size:13.5px; color:var(--muted); font-weight:600; padding:2px 20px 0;} .ctx b{color:var(--navy);}

  /* 追従ヘッダー・切り替えセレクター・ページ内ナビは共通トンマナ層にある */

  /* 会場図。番号ピンは重ねない（図に「グッズ売場」が入っているため） */
  .venue{margin-top:14px;}
  .venue img{width:100%; height:auto; display:block;}

  /* ===== 商品カード =====
     写真は一覧でもスワイプできる。複数枚あることは点の数で分かるので、
     「写真2枚」のような枚数表示はしない。 */
  /* 2列は行ごとに高さを揃える（align-items を start にしない）。
     左右で高さが違うと、同じ並びなのに不揃いに見えるため。 */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 12px; padding:10px 16px 0;}
  /* ただし、どれか1枚を開いているあいだは揃えない。開いた側に合わせて
     隣のカードまで伸び、そこに大きな空白ができてしまうため。 */
  .grid.has-open{align-items:start;}
  .item{background:#fff; border:1px solid var(--card-bd); border-radius:var(--card-r); overflow:hidden;
        box-shadow:var(--card-sh); display:flex; flex-direction:column;
        text-align:left; width:100%; font:inherit; color:inherit; padding:0;}
  .item .bd{padding:10px 12px 12px; display:flex; flex-direction:column; flex:1;}
  .item .nm{font-size:15px; font-weight:800; line-height:1.35;}
  /* グッズの価格はグルメと逆で明快に出す。買うかどうかの判断に直結するため（指示書7.4） */
  .item .pr{font-family:var(--latin); font-size:15px; font-weight:800; color:var(--blue); margin-top:5px;}
  .item .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;}
  .tag{font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:4px; white-space:nowrap;}
  .tag.players{background:var(--yellow); color:var(--navy);}
  .tag.gacha{background:var(--navy); color:#fff;}
  /* 開閉のきっかけ。文字は短く、商品名より弱く。カードの底に揃える */
  .item .acc-btn{margin-top:auto; padding-top:10px; font-size:12.5px;}

  /* --- スワイプで見る写真面 ----------------------------------------
     JSに頼らず、CSSのスクロールスナップで動かす。指で横に送れる。
     JSが止まっても横スクロールで全部見られる状態を保つ。 */
  .swipe{position:relative; background:#f2f4f7;}
  .swipe .track{display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
                -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .swipe .track::-webkit-scrollbar{display:none;}
  .swipe .slide{flex:0 0 100%; scroll-snap-align:center; position:relative; aspect-ratio:1/1;}
  /* グッズ写真は白背景の商品撮影。切れると困るので cover ではなく contain で全体を見せる */
  .swipe .slide img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  /* 写真が何を伝えているか（3色展開・中に6本入る等）を写真の上に添える。
     めくって初めて分かる情報を、めくる前にも言葉で拾えるようにする。 */
  .swipe .cap{position:absolute; left:0; right:0; bottom:0; z-index:2;
              background:linear-gradient(transparent, rgba(4,34,66,.82));
              color:#fff; font-size:11.5px; font-weight:700; padding:18px 10px 8px;}
  /* 点は「まだ写真がある」ことの合図でもある。枚数を文字で書かずに済む */
  .swipe .dots{display:flex; justify-content:center; gap:6px; padding:8px 0 6px;}
  .swipe .dots i{width:6px; height:6px; border-radius:50%; background:rgba(4,34,66,.22); transition:background .2s, width .2s;}
  .swipe .dots i.on{width:16px; border-radius:3px; background:var(--navy);}

  /* --- 開いた中身 --- */
  .detail .ds{font-size:13.5px; color:#4b5563; line-height:1.75; margin-top:8px;}
  .detail .spec{margin-top:10px; border-top:1px solid var(--line);}
  /* 2列カードの中は幅が150px前後しかない。ラベルと値を横に並べると値が
     1文字ずつ折り返すので、ラベルを上に積む。 */
  .detail .spec .r{display:flex; flex-direction:column; gap:1px; padding:6px 0;
                   border-bottom:1px solid var(--line); font-size:12.5px;}
  .detail .spec .r .k{color:var(--muted); font-weight:700; font-size:11.5px;}
  .detail .spec .r .v{color:#33404f; min-width:0;}
  /* おすすめは1枚が広いので、ラベルと値を横に並べたほうが読みやすい */
  .picks .detail .spec .r{flex-direction:row; gap:10px;}
  .picks .detail .spec .r .k{flex:0 0 5em; font-size:12.5px;}
  .detail .pnote{margin-top:9px; font-size:12.5px; font-weight:700; color:var(--navy);}

  /* おすすめ。1列（PCは2列）で大きく見せる。開き方は一覧と同じ */
  .picks{padding:6px 16px 0; display:grid; grid-template-columns:1fr; gap:16px;}
  @media(min-width:561px){ .picks{grid-template-columns:1fr 1fr;} }
  .picks .item .nm{font-size:19px;}
  .picks .item .pr{font-size:17px;}
  .picks .item .ds{font-size:14px;}
  .picks .swipe .cap{font-size:12.5px; padding:20px 12px 9px;}

  /* オンラインストアへの案内はこのページに置かない。
     在庫の調整があり「売り切れてもオンラインで買える」と読ませてしまうため。
     このページの目的は、当日スタジアムの売店で買ってもらうこと。 */

  footer{margin-top:32px; background:var(--navy); color:#dfe6f0; padding:22px 16px 30px;}
  footer .flinks{font-size:13.5px; display:flex; flex-direction:column; gap:8px;} footer .flinks a{color:#cdd7e6; text-decoration:underline;}
  footer .note{font-size:12px; color:#8ea0b8; margin-top:16px; line-height:1.7;}

  .fab{position:fixed; right:14px; bottom:16px; z-index:60; display:none;
       align-items:center; justify-content:center; width:46px; height:46px; border-radius:8px;
       background:rgba(255,255,255,.72); border:1px solid rgba(4,34,66,.16); color:var(--navy);
       -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
       box-shadow:0 2px 8px rgba(4,34,66,.12);}
  .fab.show{display:flex;}
  .fab svg{width:22px; height:22px; fill:currentColor; display:block;}
  @media(min-width:601px){ .fab{right:calc(50% - var(--maxw)/2 + 16px);} }
</style>
</head>
<body>
<div class="wrap" id="top">

  <header class="hd">
    <div class="hd-in">
      <a class="back" href="https://tochigisc-official.github.io/homegame_lp/20260809/index.html">◀ ホームゲーム</a>
      <img class="emblem" id="emblem" alt="栃木SC" src="assets/img/tsc.webp">
      <nav class="seg"><a href="gourmet.html">グルメ</a><a class="on" href="goods.html">グッズ</a></nav>
    </div>
    <nav class="jump">
      <a href="#pickSec">おすすめ</a>
      <a href="#listSec">商品一覧</a>
      <a href="#venueSec">会場図</a>
    </nav>
  </header>

  <div class="brandmark" id="brandmark"></div>

  <div class="head first">
    <span class="hicon"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></span>
    <span class="disp">GOODS</span>
    <h2><span class="mk">スタジアムグッズ</span></h2>
  </div>
  <div class="ctx" id="ctxLine"></div>

  <div class="util rv" id="utilBar"></div>

  <div class="head" id="pickSec">
    <span class="hicon"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.5-.8z"/></svg></span>
    <h2><span class="mk">今節のおすすめ</span></h2>

   追従ヘッダーの共通の動き（グルメ・グッズ共用）
   -----------------------------------------------------------
   build_gourmet.mjs / build_goods.mjs がテンプレートの
   __NAV__ 目印にこの中身を差し込む。
   ページごとに書き分けると必ずズレるので、1か所にまとめている。
   =========================================================== */

// --- ページ内ナビの帯を、下に読み進めているあいだは畳む -----------
// 本文の見える面積を増やすため。上へ戻る動きをしたら、行き先を探して
// いる合図とみなしてすぐ出す。
// 行き先へ飛んでいる最中は畳まない（飛んだ先で帯が消えると、
// 今どこにいるのかが分からなくなるため）。
var NAV_LOCK_UNTIL = 0;
(function(){
  var hd = document.querySelector('header.hd');
  if(!hd) return;
  var last = window.pageYOffset;

  // 帯を畳むとヘッダーの高さが変わり、本文がその分だけ上下する。
  // ブラウザはこれもスクロールとして通知してくるため、素直に向きを見ると
  // 「畳む→本文が上がる→上向きと判定→戻す→本文が下がる→畳む」を
  // 繰り返して震える。切り替えた直後の短いあいだは判定を止める。
  function set(hidden){
    if(hd.classList.contains('nav-hidden') === hidden) return;
    hd.classList.toggle('nav-hidden', hidden);
    NAV_LOCK_UNTIL = Date.now() + 320;   // ずらす動き（0.22秒）が終わるまで
  }

  addEventListener('scroll', function(){
    var y = window.pageYOffset;
    if(Date.now() < NAV_LOCK_UNTIL){ last = y; return; }
    if(y < 90)             set(false);   // 最上部では必ず出す
    else if(y > last + 8)  set(true);    // 下へ読み進めている
    else if(y < last - 8)  set(false);   // 上へ戻っている
    last = y;
  }, {passive:true});
})();

// --- ページ内ナビの飛び先 ----------------------------------------
// CSSの scroll-margin だけだと、追従ヘッダーの高さが畳んだ状態で
// 変わるため、見出しが半分隠れた中途半端な位置で止まることがある。
// クリック時に実際のヘッダー高さを測って、その分だけ手前に止める。
(function(){
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('.jump a[href^="#"]') : null;
    if(!a) return;
    var t = document.querySelector(a.getAttribute('href'));
    if(!t) return;
    e.preventDefault();
    var hd = document.querySelector('header.hd');
    if(hd) hd.classList.remove('nav-hidden');
    NAV_LOCK_UNTIL = Date.now() + 900;   // 飛んでいる最中は畳まない
    var h = hd ? hd.offsetHeight : 0;
    var top = t.getBoundingClientRect().top + window.pageYOffset - h - 12;
    window.scrollTo({ top: Math.max(0, top), behavior:'smooth' });
  });
})();

  var imgs = it.images||[];
  return '<div class="swipe">'+
    '<div class="track">'+imgs.map(function(im){ return slideHtml(im, it.name); }).join('')+'</div>'+
    (imgs.length>1
      ? '<div class="dots">'+imgs.map(function(_,i){ return '<i class="'+(i?'':'on')+'"></i>'; }).join('')+'</div>'
      : '')+
  '</div>';
}

function bodyHtml(it){
  var spec='';
  if(it.spec){
    var rows=Object.keys(it.spec).filter(function(k){ return it.spec[k]; }).map(function(k){
      return '<div class="r"><span class="k">'+esc(SPEC_LABEL[k]||k)+'</span><span class="v">'+esc(it.spec[k])+'</span></div>';
    }).join('');
    if(rows) spec='<div class="spec">'+rows+'</div>';
  }
  var pnote = it.allPlayers ? '<p class="pnote">全選手展開です。推しの選手は売店で選べます。</p>' : '';
  return '<p class="ds">'+esc(it.desc||'')+'</p>'+spec+pnote;
}

// open=true のカードは説明を最初から出す（おすすめ用）。
// 一覧はアコーディオンにして、カードの高さを揃えたまま置く。
function cardHtml(it, alwaysOpen){
  var tags='';
  if(it.allPlayers) tags+='<span class="tag players">全選手展開</span>';
  if(it.gacha)      tags+='<span class="tag gacha">ガチャ</span>';

  // 文字は短く。何も出さないとカードが押せることが伝わらず、
  // 素材・サイズ（買う判断の材料）が誰にも開かれないまま終わる。
  var body = alwaysOpen
    ? '<div class="detail">'+bodyHtml(it)+'</div>'
    : '<button class="acc-btn" type="button" aria-expanded="false" '+
        'data-open-label="とじる" data-closed-label="くわしく">くわしく<span class="chev">▶</span></button>'+
      '<div class="acc-body detail" hidden>'+bodyHtml(it)+'</div>';

  return '<div class="item" data-id="'+esc(it.id)+'">'+
    swipeHtml(it)+
    '<div class="bd">'+
      '<div class="nm">'+esc(it.name)+'</div>'+
      '<div class="pr">'+yen(it.price)+'</div>'+
      (tags? '<div class="tags">'+tags+'</div>' : '')+
      body+
    '</div>'+
  '</div>';
}

(function(){
  var items = DATA.items||[];

  // おすすめ。開き方は一覧と同じ（「くわしく ▶」）。同じカードで挙動が違うと迷うため。
  var picks = items.filter(function(i){ return i.hero; });
  document.getElementById('picks').innerHTML = picks.map(function(i){ return cardHtml(i, false); }).join('');

  // 一覧は区分を作らず、全商品を掲載順にそのまま並べる。
  // 毎試合ラインナップが変わるので、区分の割り当てが運用の手間になるため。
  document.getElementById('list').innerHTML =
    '<div class="grid">'+items.map(function(i){ return cardHtml(i, false); }).join('')+'</div>';

  var cnt=document.getElementById('cnt'); if(cnt) cnt.textContent = '全'+items.length+'品';
})();

// スワイプ位置に合わせて点を更新。スクロールそのものはCSSがやっている。
(function(){
  document.addEventListener('scroll', function(e){
    var t=e.target;
    if(!t.classList || !t.classList.contains('track')) return;
    var dots=t.parentNode.querySelector('.dots'); if(!dots) return;
    var i=Math.round(t.scrollLeft / t.clientWidth);
    [].forEach.call(dots.children, function(d,n){ d.classList.toggle('on', n===i); });
  }, true);
})();

// 上へ戻る
(function(){
  var fab=document.getElementById('fab'); if(!fab) return;
  function upd(){ fab.classList.toggle('show', window.pageYOffset > 600); }
  window.addEventListener('scroll', upd, {passive:true}); upd();
})();
</script>
</body>
</html>
